<!doctype html>
<html lang="en" data-page="games">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAME//LOG · JSBV.LIFE</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#07060f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="JSBV.LIFE">
<meta property="og:title" content="GAME//LOG · JSBV.LIFE">
<meta property="og:description" content="Every Fortnite season since 2017 on its calendar: level and wins, season by season.">
<meta property="og:url" content="https://jsbv.life/games/">
<meta property="og:image" content="https://jsbv.life/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Every Fortnite season since 2017 on its calendar: level and wins, season by season.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="modulepreload" href="../assets/core.js">
<style>
/* Video games. Data: games/data/fortnite.json (scripts/build_fortnite.py: Epic export "Past Seasons" + the season calendar).
   Tabs (assets/site.js): Fortnite (season timeline), Seasons (table). PlayStation trophies come later as their own tab. */
.ctl { display: flex; flex-wrap: wrap; gap: 8px; }
.ctl button { font: 600 var(--s-0) var(--f-data); letter-spacing: 0.08em; color: var(--dim); background: none; border: 1px solid var(--grid); padding: 6px 10px; cursor: pointer; min-height: 32px; }
.ctl button[aria-pressed="true"] { color: var(--void); background: var(--violet); border-color: var(--violet); }
.ctl .gap { width: 12px; }
.chart .lab { fill: var(--ink); }
.chart rect.hit { cursor: pointer; outline: none; }
.chart rect.s.on { stroke: var(--hot); stroke-width: 1.5; }
.read b { color: var(--hot); }
th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
tr.ch td { color: var(--violet); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; border-bottom-color: var(--violet); }
td .b { display: inline-block; height: 8px; background: var(--violet); vertical-align: middle; margin-right: 6px; box-shadow: 0 0 6px var(--violet); }
</style>
<body>
<div class="wrap">
  <header>
    <nav class="site" data-here="media" data-crumb="GAME//LOG"></nav>
    <h1 style="margin-top:14px">GAME<span>//LOG</span></h1>
  </header>
  <p class="note" id="err" hidden>Data failed to load.</p>
  <div class="readout">
    <div><span>Seasons played</span><strong id="r-seasons">—</strong></div>
    <div><span>Wins</span><strong id="r-wins" style="color:var(--trail)">—</strong></div>
    <div><span>Levels</span><strong id="r-levels" style="color:var(--step)">—</strong></div>
    <div><span>Best season</span><strong id="r-best" style="color:var(--violet)">—</strong></div>
    <div><span>Now</span><strong id="r-now">—</strong></div>
  </div>
  <nav class="ptabs" data-default="fortnite" aria-label="Sections of Video games">
    <a href="#fortnite" data-tab="fortnite" data-alias="timeline">Fortnite</a>
    <a href="#seasons" data-tab="seasons" data-alias="table">Seasons</a>
  </nav>
  <section data-tab="fortnite">
    <h2>Fortnite, on the season calendar</h2>
    <div class="ctl" id="ctl">
      <button data-m="level" aria-pressed="true">LEVEL</button><button data-m="wins" aria-pressed="false">WINS</button>
      <button data-m="wpw" aria-pressed="false">WINS / WEEK</button>
      <span class="gap"></span>
      <button data-span="recent" aria-pressed="true">SINCE CHAPTER 3</button><button data-span="all" aria-pressed="false">ALL, FROM 2017</button>
    </div>
    <div class="chart" id="chart"></div>
    <div class="read" id="read" aria-live="polite">Each bar is one season, as wide as the season ran. Hover or tap one.</div>
    
  </section>
  <section data-tab="seasons">
    <h2>Season by season</h2>
    <div class="scroll"><table id="tbl"></table></div>
  </section>
  <footer>Epic Games data export · season calendar</footer>
</div>
<script src="../assets/site.js"></script>
<script type="module">
import { $, el, svg, epochDay, dateLabel, fmtInt, loadJSON, C } from '../assets/core.js';

const today = Math.floor(Date.now() / 864e5);
const D = await loadJSON('data/fortnite.json', { optional: true });
if (!D) { $('#err').hidden = false; SiteTabs.start(); throw new Error('games/data/fortnite.json did not load'); }

const S = D.seasons.map((s) => ({ ...s, a: epochDay(s.start), b: s.end ? epochDay(s.end) : Math.max(today, epochDay(s.start) + 1) }));
for (const s of S) s.wpw = s.wins != null ? s.wins / Math.max(1, (s.b - s.a + 1) / 7) : null;
const played = S.filter((s) => s.level);
const best = played.reduce((m, s) => (s.level > m.level ? s : m), played[0]);
const cur = S.find((s) => s.current) || S[S.length - 1];
$('#r-seasons').textContent = played.length; $('#r-wins').textContent = fmtInt(D.totals.wins); $('#r-levels').textContent = fmtInt(D.totals.levels);
$('#r-best').textContent = best ? `${best.name}, level ${best.level}` : '—'; $('#r-now').textContent = cur ? `${cur.name}` : '—';

const CH_COL = { 'Chapter 1': '#6b6880', 'Chapter 3': C.step, 'Chapter 4': C.trail, 'Chapter 5': C.climb, 'Chapter 6': C.sound, 'Chapter 7': C.violet };
const M = { level: ['Level', 'level'], wins: ['Wins', 'wins'], wpw: ['Wins per week', 'wins / week'] };
const V = { m: 'level', span: 'recent', on: null };
const range = (s) => `${dateLabel(s.start)} – ${s.end ? dateLabel(s.end) : 'now'}`;

function readOf(s) {
  const weeks = ((s.b - s.a + 1) / 7).toFixed(1);
  if (!s.level) return `<b>${s.chapter} ${s.season}: ${s.name}</b> · ${range(s)}${s.current ? ' · in progress, no stats until it ends' : ' · not played'}`;
  return `<b>${s.chapter} ${s.season}: ${s.name}</b> · ${range(s)} (${weeks} weeks)<br>`
    + `Level ${s.level} · ${s.wins} wins (${s.wpw.toFixed(1)} a week)${s.theme ? ' · ' + s.theme : ''}`;
}

function draw() {
  const host = $('#chart'), W = host.clientWidth; if (W < 80) return;
  const rows = S.filter((s) => V.span === 'all' || s.a >= epochDay('2021-12-01'));
  const H = W < 560 ? 270 : 330, padL = 40, padR = 12, top = 40, bot = 26, ih = H - top - bot;
  const x0 = Math.min(...rows.map((s) => s.a)), x1 = Math.max(...rows.map((s) => s.b));
  // On "all", squeeze the empty 2019–2021 gap so 2018 doesn't take half the width.
  const gapA = epochDay('2019-03-15'), gapB = epochDay('2021-11-15'), squeeze = V.span === 'all';
  const t = (d) => squeeze && d > gapA ? (d >= gapB ? d - (gapB - gapA) + 60 : gapA + (d - gapA) * 60 / (gapB - gapA)) : d;
  const X = (d) => padL + (t(d) - t(x0)) / (t(x1) - t(x0)) * (W - padL - padR);
  const vals = rows.map((s) => s[V.m]).filter((v) => v != null), vmax = Math.max(1, ...vals) * 1.08;
  const Y = (v) => top + ih - (v / vmax) * ih;
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${M[V.m][0]} per Fortnite season` });
  // chapter bands + labels
  const chs = []; for (const s of rows) { const c = chs[chs.length - 1]; if (c && c.ch === s.chapter) c.b = s.b; else chs.push({ ch: s.chapter, a: s.a, b: s.b }); }
  chs.forEach((c, i) => {
    root.append(svg('rect', { x: X(c.a), y: top - 18, width: Math.max(1, X(c.b) - X(c.a)), height: ih + 18, fill: i % 2 ? C.well : '#0f0c20' }));
    const w = X(c.b) - X(c.a);
    if (w > 36) root.append(svg('text', { x: X(c.a) + 4, y: top - 6, fill: CH_COL[c.ch] || C.dim }, (w > 90 ? c.ch : c.ch.replace('Chapter ', 'Ch ')).toUpperCase()));
  });
  if (squeeze) { const xa = X(gapA + 1), xb = X(gapB - 1); root.append(svg('text', { x: (xa + xb) / 2, y: top + ih / 2, 'text-anchor': 'middle' }, '2019–21')); }
  // gridlines
  const step = vmax > 150 ? 50 : vmax > 40 ? 10 : vmax > 8 ? 2 : 0.5;
  for (let v = 0; v <= vmax; v += step) {
    root.append(svg('line', { x1: padL, x2: W - padR, y1: Y(v), y2: Y(v), stroke: C.grid }));
    root.append(svg('text', { x: padL - 6, y: Y(v) + 4, 'text-anchor': 'end' }, step < 1 ? v.toFixed(1) : String(v)));
  }
  root.append(svg('text', { x: padL, y: 12, fill: C.ink }, M[V.m][0].toUpperCase() + ' AT SEASON END'));
  // years along the bottom
  for (let y = new Date(x0 * 864e5).getUTCFullYear() + 1; y <= new Date(x1 * 864e5).getUTCFullYear(); y++) {
    const d = epochDay(`${y}-01-01`); if (squeeze && d > gapA && d < gapB) continue;
    root.append(svg('line', { x1: X(d), x2: X(d), y1: top + ih, y2: top + ih + 5, stroke: C.dim }));
    root.append(svg('text', { x: X(d), y: H - 8, 'text-anchor': 'middle' }, String(y)));
  }
  // season bars
  for (const s of rows) {
    const v = s[V.m], x = X(s.a) + 1, w = Math.max(2, X(s.b) - X(s.a) - 2), col = CH_COL[s.chapter] || C.dim;
    const g = svg('g');
    if (v == null) {
      g.append(svg('rect', { class: 's' + (V.on === s ? ' on' : ''), x, y: top + ih - 6, width: w, height: 6, fill: 'none', stroke: col, 'stroke-dasharray': '3 3' }));
    } else {
      g.append(svg('rect', { class: 's' + (V.on === s ? ' on' : ''), x, y: Y(v), width: w, height: top + ih - Y(v), fill: col, 'fill-opacity': 0.75 }));
      if (w > 30) g.append(svg('text', { class: 'lab', x: x + w / 2, y: Y(v) - 4, 'text-anchor': 'middle' }, V.m === 'wpw' ? v.toFixed(1) : String(v)));
    }
    g.append(svg('rect', { x, y: top, width: w, height: ih, fill: 'transparent', class: 'hit', tabindex: 0, role: 'button', 'aria-label': `${s.chapter} ${s.season} ${s.name}` }));
    const pick = () => { V.on = s; $('#read').innerHTML = readOf(s); for (const r of root.querySelectorAll('rect.on')) r.classList.remove('on'); g.firstChild.classList.add('on'); };
    g.addEventListener('mouseenter', pick); g.addEventListener('click', pick); g.addEventListener('focusin', pick);
    root.append(g);
  }
  if (today <= x1) root.append(svg('line', { x1: X(today), x2: X(today), y1: top - 18, y2: top + ih, stroke: C.hot, 'stroke-dasharray': '2 3', 'stroke-opacity': 0.6 }));
  host.replaceChildren(root);
}

function table() {
  const maxL = Math.max(...played.map((s) => s.level));
  const row = (cells, cls) => el('tr', { className: cls || '' }, cells.map((c) => el('td', {}, [c instanceof Node ? c : String(c)])));
  const rows = []; let ch = null;
  for (const s of [...S].reverse()) {
    if (s.chapter !== ch) { ch = s.chapter; rows.push(row([ch, '', '', '', '', '', ''], 'ch')); }
    const lv = el('span', {}, [s.level ? el('i', { className: 'b', style: `width:${Math.round(60 * s.level / maxL)}px` }) : null, s.level ? String(s.level) : (s.current ? 'in progress' : '—')]);
    rows.push(row([s.season.replace('Season ', 'S').replace('Mini S', 'Mini '), s.name, range(s), ((s.b - s.a + 1) / 7).toFixed(0),
      lv, s.wins ?? '—', s.wpw != null && s.level ? s.wpw.toFixed(1) : '—']));
  }
  const head = ['Season', 'Name', 'Dates', 'Weeks', 'Level', 'Wins', 'Wins / wk'];
  $('#tbl').replaceChildren(el('thead', {}, [el('tr', {}, head.map((h) => el('th', { text: h })))]), el('tbody', {}, rows));
}

for (const b of $('#ctl').querySelectorAll('button')) b.addEventListener('click', () => {
  const k = b.dataset.m ? 'm' : 'span'; V[k] = b.dataset[k];
  for (const o of $('#ctl').querySelectorAll(`button[data-${k}]`)) o.setAttribute('aria-pressed', String(o === b));
  draw(); if (V.on) $('#read').innerHTML = readOf(V.on);
});
table();
addEventListener('tabchange', draw); addEventListener('resize', draw);
SiteTabs.start(); draw();
</script>
