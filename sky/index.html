  g.addColorStop(0, 'rgba(14,18,38,.85)'); g.addColorStop(1, 'rgba(8,9,20,.55)');
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, rZo, 0, 7); x.fill();

  // zodiac band
  for (let i = 0; i < 12; i++) {
    const a0 = ang(i * 30), a1 = ang(i * 30 + 30);
    x.fillStyle = ELEM[i % 4] + '16';
    x.beginPath(); x.arc(cx, cy, rZo, -a0, -a1, true); x.arc(cx, cy, rZi, -a1, -a0, false); x.closePath(); x.fill();
    const [lx, ly] = P(i * 30 + 15, (rZo + rZi) / 2);
    x.fillStyle = ELEM[i % 4]; x.font = `${fs * 1.15}px ${SYM}`;
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(SG[i], lx, ly);
  }
  x.strokeStyle = 'rgba(233,230,242,.18)'; x.lineWidth = 1;
  x.beginPath();
  for (let d = 0; d < 360; d++) {
    const len = d % 30 === 0 ? rZo - rZi : d % 10 === 0 ? R * .035 : d % 5 === 0 ? R * .022 : R * .011;
    const [ax, ay] = P(d, rZi), [bx, by] = P(d, rZi + len); x.moveTo(ax, ay); x.lineTo(bx, by);
  }
  x.stroke();
  x.strokeStyle = 'rgba(233,230,242,.3)';
  for (const r of [rZo, rZi, rPl]) { x.beginPath(); x.arc(cx, cy, r, 0, 7); x.stroke(); }

  // houses: sky half tint, cusps, numbers
  const cu = C.h.cusps;
  for (let i = 0; i < 12; i++) {
    const a = cu[i], b = cu[(i + 1) % 12], above = i >= 6;
    x.fillStyle = above ? 'rgba(120,150,220,.07)' : 'rgba(0,0,0,.18)';
    x.beginPath(); x.arc(cx, cy, rPl, -ang(a), -ang(a + norm360(b - a)), true); x.arc(cx, cy, rHi, -ang(a + norm360(b - a)), -ang(a), false); x.closePath(); x.fill();
  }
  if (S.asp) {
    for (let i = 0; i < C.pos.length - 1; i++) for (let j = i + 1; j < C.pos.length - 1; j++) {
      const d = Math.abs(norm180(C.pos[i].lon - C.pos[j].lon));
      for (const A of ASP) {
        if (A.a === 0) continue;
        const orb = Math.abs(d - A.a); if (orb > A.o) continue;
        const [ax, ay] = P(C.pos[i].lon, rPl), [bx, by] = P(C.pos[j].lon, rPl);
        x.strokeStyle = (A.a === 90 || A.a === 180) ? `rgba(255,107,107,${.65 - orb / A.o * .45})` : `rgba(111,211,199,${.6 - orb / A.o * .42})`;
        x.lineWidth = A.a === 60 ? .8 : 1.3; x.setLineDash(A.a === 60 ? [3, 4] : []);
        x.beginPath(); x.moveTo(ax, ay); x.lineTo(bx, by); x.stroke();
      }
    }
    x.setLineDash([]);
  }
  for (let i = 0; i < 12; i++) {
    const angle = i % 3 === 0;
    x.strokeStyle = angle ? 'rgba(255,179,71,.8)' : 'rgba(233,230,242,.22)'; x.lineWidth = angle ? 1.6 : 1;
    const [ax, ay] = P(cu[i], rHi), [bx, by] = P(cu[i], angle ? rZo + 8 : rZi); x.beginPath(); x.moveTo(ax, ay); x.lineTo(bx, by); x.stroke();
    const mid = cu[i] + norm360(cu[(i + 1) % 12] - cu[i]) / 2, [nx, ny] = P(mid, (rHi + rPl) / 2 - (rPl - rHi) * .18);
    x.fillStyle = 'rgba(233,230,242,.42)'; x.font = `500 ${fs * .72}px 'Chakra Petch', sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(i + 1, nx, ny);
  }
  // angle labels outside rim
  x.font = `600 ${fs * .7}px 'Chakra Petch', sans-serif`; x.fillStyle = '#ffb347';
  [['ASC', C.h.asc], ['DSC', C.h.asc + 180], ['MC', C.h.mc], ['IC', C.h.mc + 180]].forEach(([t, l]) => {
    const [lx, ly] = P(l, rZo + 20); x.fillText(t, Math.min(W - 16, Math.max(16, lx)), Math.min(H - 8, Math.max(8, ly)));
  });

  // Earth
  const size = Math.min(420, Math.round(rE * 2 * dpr)), lat0 = Math.max(-35, Math.min(35, S.lat));
  if (!G || G.size !== size || G.lat0 !== lat0) buildGlobe(size, lat0);
  const isToday = new Date(ms).toDateString() === new Date().toDateString();
  const lon0 = S.lon - (ms - Date.now()) / DAY * 360.9856 + (S.spin ? spinDeg : 0);
  g = x.createRadialGradient(cx, cy, rE * .9, cx, cy, rE * 1.35);
  g.addColorStop(0, 'rgba(90,150,255,.45)'); g.addColorStop(1, 'rgba(90,150,255,0)');
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, rE * 1.35, 0, 7); x.fill();
  x.save(); x.beginPath(); x.arc(cx, cy, rE, 0, 7); x.clip();
  x.drawImage(renderEarth(ms, lon0, isToday && cloudDay !== null), cx - rE, cy - rE, rE * 2, rE * 2); x.restore();
  { // observer marker
    const c0 = Math.cos(lat0 * RAD), s0 = Math.sin(lat0 * RAD), p = S.lat * RAD, dl = (S.lon - lon0) * RAD;
    const ox = Math.cos(p) * Math.sin(dl), oy = c0 * Math.sin(p) - s0 * Math.cos(p) * Math.cos(dl), oz = s0 * Math.sin(p) + c0 * Math.cos(p) * Math.cos(dl);
    if (oz > 0.05) { x.fillStyle = '#ffb347'; x.strokeStyle = 'rgba(255,179,71,.6)'; x.beginPath(); x.arc(cx + ox * rE, cy - oy * rE, 2.6, 0, 7); x.fill(); x.beginPath(); x.arc(cx + ox * rE, cy - oy * rE, 6, 0, 7); x.stroke(); }
  }

  // planets: spread glyphs, leader lines
  const rG = R * .755, sep = fs * 1.55 / rG;
  const items = C.pos.map(p => ({p, a: norm360((ang(p.lon)) / RAD) * RAD})).sort((m, n) => m.a - n.a);
  items.forEach(it => it.d = it.a);
  for (let k = 0; k < 60; k++) {
    for (let i = 0; i < items.length; i++) {
      const A_ = items[i], B_ = items[(i + 1) % items.length];
      let diff = B_.d - A_.d; if (i === items.length - 1) diff += Math.PI * 2;
      if (diff < sep) { const push = (sep - diff) / 2; A_.d -= push; B_.d += push; }
    }
  }
  hits = [];
  const el = norm360(C.pos[1].lon - C.pos[0].lon);
  for (const it of items) {
    const p = it.p, a = it.d, gx = cx + rG * Math.cos(a), gy = cy - rG * Math.sin(a);
    const [tx, ty] = P(p.lon, rZi), [ux, uy] = P(p.lon, rZi - R * .035);
    x.strokeStyle = p.c + '99'; x.lineWidth = 1;
    x.beginPath(); x.moveTo(ux, uy); x.lineTo(gx + (fs * .75) * Math.cos(a), gy - (fs * .75) * Math.sin(a)); x.stroke();
    x.fillStyle = p.c; x.beginPath(); x.arc(tx, ty, 2.4, 0, 7); x.fill();
    if (p.id === 'moon') drawMoon(x, gx, gy, fs * .62, el);
    else {
      x.fillStyle = 'rgba(8,9,20,.75)'; x.beginPath(); x.arc(gx, gy, fs * .72, 0, 7); x.fill();
      if (p.id === 'sun') { const sg = x.createRadialGradient(gx, gy, 0, gx, gy, fs * 1.4); sg.addColorStop(0, 'rgba(255,211,107,.45)'); sg.addColorStop(1, 'rgba(255,211,107,0)'); x.fillStyle = sg; x.beginPath(); x.arc(gx, gy, fs * 1.4, 0, 7); x.fill(); }
      x.fillStyle = p.c; x.font = `${fs * 1.25}px ${SYM}`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(p.g, gx, gy + 1);
    }
    const lx = cx + R * .665 * Math.cos(a), ly = cy - R * .665 * Math.sin(a);
    x.fillStyle = 'rgba(233,230,242,.6)'; x.font = `500 ${fs * .58}px 'Chakra Petch', sans-serif`; x.fillText(Math.floor(p.lon % 30) + '°', lx, ly);
    hits.push({x: gx, y: gy, p});
  }
}

// ---------- panel ----------
let lunCache = null, lastPanel = 0;
const PH8 = ['New','Crescent','First Quarter','Gibbous','Full','Disseminating','Last Quarter','Balsamic'];
const astroPhase = e => e < 7.5 || e >= 352.5 ? 'New Moon' : e < 82.5 ? 'Waxing Crescent' : e < 97.5 ? 'First Quarter' : e < 172.5 ? 'Waxing Gibbous' : e < 187.5 ? 'Full Moon' : e < 262.5 ? 'Waning Gibbous' : e < 277.5 ? 'Last Quarter' : 'Waning Crescent';
function lunations(ms) {
  if (lunCache && ms >= lunCache.from && ms < lunCache.ev[0].t) return lunCache;
  const ev = []; let t = ms;
  const nm = ['New Moon','First Quarter','Full Moon','Last Quarter'];
  for (let i = 0; i < 8; i++) {
    let best = null, k = 0;
    for (let j = 0; j < 4; j++) { const v = nextPhase(t, j * 90); if (v && (best === null || v < best)) { best = v; k = j; } }
    const nd = Math.abs(norm180(lonOf('sun', best) - lonOf('node', best))), dn = Math.min(nd, 180 - nd);
    ev.push({t: best, k, n: nm[k], lon: lonOf('moon', best), ecl: (k === 0 && dn < 16.5) ? 'solar eclipse window' : (k === 2 && dn < 12) ? 'lunar eclipse window' : ''});
    t = best + 36e5;
  }
  const pn = prevNew(ms), nn = ev.find(e => e.k === 0).t;
  // next Moon ingress
  const s0 = signOf(lonOf('moon', ms)); let a = ms, b = ms;
  while (signOf(lonOf('moon', b)) === s0) b += 36e5;
  a = b - 36e5; for (let i = 0; i < 25; i++) { const m = (a + b) / 2; if (signOf(lonOf('moon', m)) === s0) a = m; else b = m; }
  return lunCache = {from: ms, ev, pn, nn, ingress: b, ingSign: (s0 + 1) % 12};
}
function updatePanel(force) {
  const now = performance.now(); if (!force && now - lastPanel < 450) return; lastPanel = now;
  const ms = S.ms, C = compute(ms), h = C.h, el = norm360(C.pos[1].lon - C.pos[0].lon), L = lunations(ms);
  const d = new Date(ms);
  $('#time').textContent = d.toLocaleString([], {weekday:'short', month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', second: S.rate <= 60 ? '2-digit' : undefined});
  $('#status').innerHTML = S.live ? '<b>Live</b> · ' + PLACES.concat([['Custom place']])[S.place][0] : (S.playing ? `Time-lapse · ${$('#speed').selectedOptions[0].text}` : 'Paused') + ' · ' + PLACES.concat([['Custom place']])[S.place][0];
  $('#big3').innerHTML = `<span>☉︎</span> ${SIGNS[signOf(C.pos[0].lon)]} · <span>☽︎</span> ${SIGNS[signOf(C.pos[1].lon)]} · Rising ${SIGNS[signOf(h.asc)]}` + (h.used !== S.sys ? ' · Placidus fails at this latitude; showing Porphyry' : '');
  // moon
  const mb = $('#moonBig').getContext('2d'); mb.clearRect(0, 0, 184, 184);
  const gl = mb.createRadialGradient(92, 92, 60, 92, 92, 92); gl.addColorStop(0, 'rgba(220,230,255,.18)'); gl.addColorStop(1, 'rgba(220,230,255,0)'); mb.fillStyle = gl; mb.fillRect(0, 0, 184, 184);
  drawMoon(mb, 92, 92, 70, el);
  const age = L.pn ? (ms - L.pn) / DAY : el / 12.19;
  $('#moonTxt').innerHTML = `<div class="ph">${astroPhase(el)}</div><div class="sub">${PH8[Math.floor(el / 45) % 8]} phase of the lunation · ${Math.round((1 - Math.cos(el * RAD)) / 2 * 100)}% lit · day ${age.toFixed(1)} of 29.5</div><div class="sub">Moon ${fmtDeg(C.pos[1].lon)} ${SIGNS[signOf(C.pos[1].lon)]} · enters ${SIGNS[L.ingSign]} ${fmtWhen(L.ingress)}</div>`;
  const st = $('#strip'), sw = st.clientWidth, sh = st.clientHeight;
  if (sw) {
    st.width = sw * dpr; st.height = sh * dpr; const sx = st.getContext('2d'); sx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const span = (L.nn - (L.pn || L.nn - 29.53 * DAY)), t0 = L.nn - span, n = 15, r = Math.min(sh / 2 - 6, sw / n / 2 - 2);
    for (let i = 0; i < n; i++) { const e = i / (n - 1) * 360; drawMoon(sx, r + 2 + i * (sw - 2 * r - 4) / (n - 1), sh / 2 - 3, r, Math.min(359.9, Math.max(.1, e)), true); }
    const f = (ms - t0) / span, mx = r + 2 + f * (sw - 2 * r - 4);
    sx.fillStyle = '#ffb347'; sx.beginPath(); sx.moveTo(mx, sh - 1); sx.lineTo(mx - 5, sh - 7 + 1); sx.lineTo(mx + 5, sh - 7 + 1); sx.fill();
  }
  $('#lun').innerHTML = L.ev.map(e => `<li><span>${e.n} in ${SIGNS[signOf(e.lon)]} ${fmtDeg(e.lon)}${e.ecl ? `<br><span class="ecl">${e.ecl}</span>` : ''}</span><span>${fmtWhen(e.t)}</span></li>`).join('');
  // bodies
  const rows = C.pos.map(p => {
    const v = norm180(lonOf(p.id, ms + DAY / 2) - lonOf(p.id, ms - DAY / 2));
    return `<tr><td class="g" style="color:${p.c}">${p.g}</td><td>${p.n}${v < 0 && p.id !== 'node' ? '<span class="rx">℞ retrograde</span>' : ''}</td><td>${fmtDeg(p.lon)} ${SIGNS[signOf(p.lon)]}</td><td class="r">H${houseOf(p.lon, h.cusps)}</td></tr>`;
  }).join('');
  $('#bodies').innerHTML = rows + `<tr><td class="g" style="color:var(--gold);font:600 12px var(--f-ui)">AC</td><td>Ascendant</td><td>${fmtDeg(h.asc)} ${SIGNS[signOf(h.asc)]}</td><td class="r"></td></tr><tr><td class="g" style="color:var(--gold);font:600 12px var(--f-ui)">MC</td><td>Midheaven</td><td>${fmtDeg(h.mc)} ${SIGNS[signOf(h.mc)]}</td><td class="r"></td></tr>`;
  // aspects
  const list = [];
  for (let i = 0; i < 10; i++) for (let j = i + 1; j < 10; j++) {
    const dd = Math.abs(norm180(C.pos[i].lon - C.pos[j].lon));
    for (const A of ASP) { const o = Math.abs(dd - A.a); if (o <= A.o) list.push({i, j, A, o}); }
  }
  list.sort((a, b) => a.o - b.o);
  $('#asplist').innerHTML = list.slice(0, 10).map(q => `<li><span><span class="s" style="color:${B[q.i].c}">${B[q.i].g}</span> ${B[q.i].n} ${q.A.n} <span class="s" style="color:${B[q.j].c}">${B[q.j].g}</span> ${B[q.j].n}</span><span>${Math.floor(q.o)}°${String(Math.round((q.o % 1) * 60)).padStart(2, '0')}′</span></li>`).join('') || '<li>No major aspects within orb.</li>';
  const today = d.toDateString() === new Date().toDateString();
  $('#wx').textContent = !today ? 'Clouds: today only'
    : wx.mode === 'live' ? `Clouds: live, Open-Meteo · here ${Math.round(wx.temp * 9 / 5 + 32)}°F, ${WCODE(wx.code)}`
    : wx.mode === 'sim' ? 'Clouds: simulated (weather feed unreachable)'
    : 'Clouds: loading';
  if (document.activeElement !== $('#dt')) { const z = new Date(ms - d.getTimezoneOffset() * 6e4); $('#dt').value = z.toISOString().slice(0, 16); }
  $('#play').textContent = S.playing ? '❚❚' : '▶'; $('#play').setAttribute('aria-label', S.playing ? 'Pause' : 'Play');
  $('#now').classList.toggle('on', S.live);
}

// ---------- loop ----------
function tick(t) {
  const dt = Math.min(.25, (t - last) / 1000); last = t;
  if (S.live) S.ms = Date.now(); else if (S.playing) S.ms += dt * 1000 * S.rate;
  if (S.spin && !reduced) spinDeg = (spinDeg - dt * 3) % 360;
  const day = Math.floor(S.ms / DAY);
  if (cloudDay !== day && new Date(S.ms).toDateString() === new Date().toDateString()) genClouds(day, S.ms);
  if (W) draw(S.ms, compute(S.ms));
  updatePanel(false);
  frame = requestAnimationFrame(tick);
}

// ---------- controls ----------
$('#place').innerHTML = PLACES.map((p, i) => `<option value="${i}">${p[0]}</option>`).join('') + `<option value="${PLACES.length}">Custom (enter coordinates)</option>`;
const sync = () => { $('#place').value = S.place; $('#lat').value = S.lat; $('#lon').value = S.lon; $('#sys').value = S.sys; $('#orient').value = S.orient; $('#asp').checked = S.asp; $('#spin').checked = S.spin; $('#speed').value = S.rate; };
sync();
const jump = dms => { S.live = false; S.ms += dms; lunCache = null; updatePanel(true); };
const setLive = () => { S.live = true; S.playing = true; S.rate = 1; $('#speed').value = 1; lunCache = null; updatePanel(true); };
$('#bDay').onclick = () => jump(-DAY); $('#bHr').onclick = () => jump(-36e5); $('#fHr').onclick = () => jump(36e5); $('#fDay').onclick = () => jump(DAY);
$('#play').onclick = () => { if (S.live) { S.live = false; S.playing = false; } else S.playing = !S.playing; updatePanel(true); };
$('#now').onclick = setLive;
$('#speed').onchange = e => { S.rate = +e.target.value; if (S.rate === 1 && S.live) return; S.live = false; S.playing = true; updatePanel(true); };
$('#dt').onchange = e => { const v = new Date(e.target.value); if (!isNaN(v)) { S.live = false; S.ms = v.getTime(); lunCache = null; updatePanel(true); } };
$('#place').onchange = e => { S.place = +e.target.value; const p = PLACES[S.place]; if (p) { S.lat = p[1]; S.lon = p[2]; } sync(); save(); updatePanel(true); };
const coord = () => { const la = +$('#lat').value, lo = +$('#lon').value; if (isFinite(la) && isFinite(lo) && Math.abs(la) < 90 && Math.abs(lo) <= 180) { S.lat = la; S.lon = lo; S.place = PLACES.length; $('#place').value = S.place; save(); updatePanel(true); } };
$('#lat').onchange = coord; $('#lon').onchange = coord;
$('#sys').onchange = e => { S.sys = e.target.value; save(); updatePanel(true); };
$('#orient').onchange = e => { S.orient = e.target.value; save(); };
$('#asp').onchange = e => { S.asp = e.target.checked; save(); };
$('#spin').onchange = e => { S.spin = e.target.checked; save(); };
addEventListener('keydown', e => {
  if (/INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.key === 'ArrowLeft') jump(e.shiftKey ? -DAY : -36e5);
  if (e.key === 'ArrowRight') jump(e.shiftKey ? DAY : 36e5);
});
const tip = $('#tip');
const hover = e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 22 * 22;
  for (const h of hits) { const d = (h.x - mx) ** 2 + (h.y - my) ** 2; if (d < bd) { bd = d; best = h; } }
  if (!best) { tip.style.opacity = 0; return; }
  const p = best.p, ms = S.ms, v = norm180(lonOf(p.id, ms + DAY / 2) - lonOf(p.id, ms - DAY / 2)), hs = houses(ms, S.lat, S.lon, S.sys);
  tip.innerHTML = `<b style="color:${p.c}">${p.n}</b><br>${fmtDeg(p.lon)} ${SIGNS[signOf(p.lon)]} · house ${houseOf(p.lon, hs.cusps)}<br>${Math.abs(v).toFixed(v > 1 ? 2 : 3)}°/day${v < 0 && p.id !== 'node' ? ' · retrograde' : ''}`;
  tip.style.left = Math.min(W - 190, best.x + 16) + 'px'; tip.style.top = Math.max(4, best.y - 20) + 'px'; tip.style.opacity = 1;
};
cv.addEventListener('pointermove', hover); cv.addEventListener('pointerdown', hover); cv.addEventListener('pointerleave', () => tip.style.opacity = 0);

genClouds(Math.floor(Date.now() / DAY), Date.now());
fetchWeather(); setInterval(fetchWeather, 60 * 6e4);
if (document.fonts) document.fonts.ready.then(() => updatePanel(true));
frame = requestAnimationFrame(tick);
}
</script>
