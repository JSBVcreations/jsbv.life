<script type="module">

  let T, segs, status;   // current timeline
  const pick = $('#t-pick');
  pick.replaceChildren(...TL.timelines.map((t) => el('option', { value: t.id, text: `${t.name} · ${t.start.slice(0, 4)}–${t.end.slice(0, 4)}` })));
  pick.hidden = TL.timelines.length < 2;
  pick.addEventListener('change', () => { use(pick.value); renderAll(); });
  function use(id) {
    T = TL.timelines.find((t) => t.id === id) || TL.timelines[0];
    segs = T.segments.map((s) => ({ ...s, ai: d2i(s.a), bi: d2i(s.b) }));
    status = Object.entries(T.statuses).map(([id, s]) => ({ id, ...s }));
    document.documentElement.style.setProperty('--s1c', status[0].color); document.documentElement.style.setProperty('--s2c', (status[1] || status[0]).color);
    $('#t-legend').replaceChildren(...status.map((s) => el('span', {}, [el('i', { style: `background:${s.color};box-shadow:0 0 8px ${s.color}` }), s.label])));
    for (const a of document.querySelectorAll('[data-tab="after"]')) if (!a.closest('nav')) a.dataset.off = T.end_event ? '' : '1';
    if (window.SiteTabs) SiteTabs.refresh();
  }
  const SC = (id) => (T.statuses[id] || {}).color || '#888';
  const dayStatus = () => { const m = new Map(); for (const s of segs) for (let i = s.ai; i <= s.bi; i++) m.set(i, s); return m; };

  // ---------------------------------------------------------------- KPIs + overview
  function renderTop() {
    const tot = {}; let longest = {};
    for (const s of segs) { const n = s.bi - s.ai + 1; tot[s.s] = (tot[s.s] || 0) + n; if (!longest[s.s] || n > longest[s.s].n) longest[s.s] = { n, s }; }
    const all = Object.values(tot).reduce((a, b) => a + b, 0), a = d2i(T.start), b = d2i(T.end);
    const yrs = Math.floor(all / 365.25), wks = Math.round((all - yrs * 365.25) / 7);
    $('#kpis').replaceChildren(
      el('div', {}, [el('span', { text: T.name }), el('strong', { text: `${all.toLocaleString()} days` }), el('small', { text: `${mdy(a)} – ${mdy(b)} · ${yrs} y ${wks} wk` })]),
      ...status.map((st) => el('div', {}, [el('span', { text: st.label }), el('strong', { style: `color:${st.color}`, text: `${(tot[st.id] || 0).toLocaleString()} d` }), el('small', { text: `${Math.round((100 * (tot[st.id] || 0)) / all)}% · ${segs.filter((s) => s.s === st.id).length} stretches` })])),
      el('div', {}, [el('span', { text: 'Places' }), el('strong', { text: String(new Set(segs.map((s) => s.p)).size) }), el('small', { text: 'cities' })]),
      T.end_event ? el('div', {}, [el('span', { text: T.end_event }), el('strong', { text: mdy(b) }), el('small', { text: `${(Math.min(lastData, d2i(new Date().toISOString().slice(0, 10))) - b).toLocaleString()} days ago` })]) : null);

    const y0 = +T.start.slice(0, 4), y1 = +T.end.slice(0, 4), RH = 26, LW = 44, PW = 732, W = LW + PW + 4, H = (y1 - y0 + 1) * RH + 24, map = dayStatus();

    MON.forEach((m, k) => g.append(svg('text', { x: LW + (k / 12) * PW + 2, y: 12 }, m)));
    for (let y = y0; y <= y1; y++) { const r = y - y0, top = 18 + r * RH, j1 = d2i(`${y}-01-01`), nd = d2i(`${y + 1}-01-01`) - j1, dw = PW / nd;
      g.append(svg('text', { x: 0, y: top + 15, style: 'fill:#dcd8ff;font-weight:600' }, String(y)));
      g.append(svg('rect', { x: LW, y: top + 2, width: PW, height: RH - 8, fill: '#120f26', rx: 3 }));
      let run = null; const flush = () => { if (!run) return; const x = LW + run.k0 * dw, w = (run.k1 - run.k0 + 1) * dw, s = run.s;
          const r_ = svg('rect', { x, y: top + 2, width: Math.max(1, w), height: RH - 8, fill: SC(s.s), opacity: 0.88 });
          bindTip(r_, () => `<b>${T.statuses[s.s].label}</b> · ${s.p}<br>${mdy(s.ai)} – ${mdy(s.bi)} · ${(s.bi - s.ai + 1)} days`); g.append(r_); run = null; };
      for (let k = 0; k < nd; k++) { const s = map.get(j1 + k); if (run && run.s === s) { run.k1 = k; continue; } flush(); if (s) run = { s, k0: k, k1: k }; }

      if (T.end_event && d2i(T.end) >= j1 && d2i(T.end) < j1 + nd) { const x = LW + (d2i(T.end) - j1 + 1) * dw; g.append(svg('line', { x1: x, x2: x, y1: top - 2, y2: top + RH - 4, stroke: '#fff', 'stroke-width': 2 }), svg('text', { x: x + 4, y: top + 15, style: 'fill:#fff;font-weight:700' }, T.end_event)); }

    for (const st of status) { const ss = segs.filter((s) => s.s === st.id), lens = ss.map((s) => s.bi - s.ai + 1), lg = longest[st.id];

        el('div', { className: 'kpi', style: `--cc:${st.color}` }, [el('span', { text: `${st.label}: longest` }), el('b', { text: `${lg ? lg.n : 0} d` }), el('em', { text: lg ? `${mdy(lg.s.ai)} – ${md(lg.s.bi)} · ${lg.s.p}` : '' })])); }

      el('tbody', {}, [...segs].reverse().map((s) => el('tr', {}, [el('td', { text: mdy(s.ai) }), el('td', { text: mdy(s.bi) }), el('td', { text: String(s.bi - s.ai + 1) }),
        el('td', { style: `color:${SC(s.s)};font-weight:600`, text: T.statuses[s.s].label }), el('td', { style: 'text-align:right', text: s.p })]))));
  }

  // ---------------------------------------------------------------- statuses compared
  // Raw: mean per day in each status. "Usual for the date": each day minus that number's average for its calendar month
  // over the whole record, so a status that happened to fall in summer is not credited with summer. Weekly check: weeks
  // that sit entirely in one status, compared with Welch's t on the weekly means.
  const CMP = { mode: 'raw' };
  function compareRows() {
    const map = dayStatus(), [A, B] = status;
    return LINES.map((L) => {
      const vals = { [A.id]: [], [B.id]: [] }, res = { [A.id]: [], [B.id]: [] }, wk = {};

    }).filter(Boolean);
  }
  const strength = (t) => { const a = Math.abs(t || 0); return a >= 3 ? 3 : a >= 2 ? 2 : a >= 1 ? 1 : 0; };

  // ---------------------------------------------------------------- map
