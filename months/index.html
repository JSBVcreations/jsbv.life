<!doctype html>
<html lang="en" data-page="months">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REPORT//CARDS · JSBV.LIFE</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#07060f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="JSBV.LIFE">
<meta property="og:title" content="REPORT//CARDS · JSBV.LIFE">
<meta property="og:description" content="One report card per month: fitness and health graded against every month on record.">
<meta property="og:url" content="https://jsbv.life/months/">
<meta property="og:image" content="https://jsbv.life/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="One report card per month: fitness and health graded against every month on record.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/theme.css">
<style>
/* Report cards. Data: meta-log/data/months.json (scripts/build_report_cards.py). Grades: percentile of the month among every
   month on record for that number (A 80+, B 60+, C 40+, D 20+, F); resting and walking heart rate are flipped. Media: no grade. */
body { line-height: 1.4; padding: 20px max(14px, env(safe-area-inset-right, 0px)) 48px max(14px, env(safe-area-inset-left, 0px)); }
h1 { margin: 10px 0 0; font-size: clamp(2rem, 6vw, 3.6rem); }
.strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end; height: 92px; padding: 12px 16px; }
.strip a { display: grid; grid-template-rows: 1fr auto; height: 100%; text-decoration: none; color: var(--dim); font: 600 10px var(--f-ui); letter-spacing: .1em; text-align: center; }
.strip i { align-self: end; display: block; border-radius: 4px 4px 0 0; background: var(--c); box-shadow: 0 0 10px var(--c); min-height: 3px; }
.strip a:hover { color: var(--hot); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.rc { padding: 14px 16px 12px; display: grid; gap: 8px; scroll-margin-top: 16px; }
.rc header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rc h2 { font: 700 1.05rem var(--f-ui); letter-spacing: .14em; text-transform: uppercase; margin: 0; color: var(--hot); }
.rc h2 small { font: 400 10px var(--f-data); color: var(--dim); letter-spacing: 0; margin-left: 6px; text-transform: none; }
.gpa { font: 600 2rem/1 var(--f-data); color: var(--c); text-shadow: 0 0 12px var(--c); }
.gpa small { font-size: 11px; color: var(--dim); text-shadow: none; margin-left: 3px; }
.cl { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 6px; align-items: start; }
.cl > span { font: 600 10px var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); padding-top: 4px; }
.mx { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 4px; }
.g { display: flex; white-space: nowrap; overflow: hidden; align-items: baseline; gap: 5px; border: 1px solid var(--grid); border-radius: 7px; padding: 3px 7px; font: 400 11px var(--f-data); color: var(--dim); }
.g b { font: 700 12px var(--f-data); color: var(--c, var(--ink)); }
.g em { font-style: normal; color: var(--ink); }
.foot { font: 400 11px var(--f-data); color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 14px; border-top: 1px solid var(--grid); padding-top: 7px; }
.foot b { color: var(--ink); font-weight: 600; }
.key { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 400 11px var(--f-data); color: var(--dim); }
.key b { color: var(--c); }
@media (max-width: 560px) { .cl { grid-template-columns: 1fr; gap: 2px; } .cl > span { padding: 0; } .strip { gap: 3px; padding: 10px; } .strip a { font-size: 8px; letter-spacing: 0; } }
body::after { content: none; }
.seasons .head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.s-compare { display: grid; gap: 7px; }
.s-leg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.s-leg button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font: 600 var(--s-0) var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); padding: 6px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--sc) 45%, transparent); background: color-mix(in srgb, var(--sc) 10%, transparent); }
.s-leg button i { width: 10px; height: 10px; border-radius: 3px; background: var(--sc); box-shadow: 0 0 8px var(--sc); }
.s-leg button.on { color: #07060f; background: var(--sc); border-color: var(--sc); box-shadow: 0 0 16px color-mix(in srgb, var(--sc) 55%, transparent); }
.s-leg button.on i { background: #07060f; box-shadow: none; }
.s-leg button:focus-visible { outline: 2px solid var(--sc); outline-offset: 2px; }
.s-leg .s-view { margin-left: auto; }
.s-leg .seg button { border: 0; border-radius: 0; padding: 7px 14px; }
.s-stacked { display: grid; gap: 7px; }
.s-grouped { overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.s-grouped svg { display: block; width: 100%; min-width: 820px; height: auto; }
.s-grouped .ax { font: 400 10px var(--f-data); fill: #8a84b8; }
.s-grouped .gl { font: 700 10.5px var(--f-ui); letter-spacing: 0.1em; }
.s-grouped .gv { font: 600 9.5px var(--f-data); fill: #8a84b8; }
.s-grouped .gv.on { fill: #fff; font-weight: 700; }
.s-grouped .gd { font: 700 10px var(--f-data); }
.s-grouped .gd.up { fill: #5dff8a; }
.s-grouped .gd.dn { fill: #ff4d6d; }
.s-grouped rect.gb { cursor: pointer; transition: opacity .15s; }
.s-grouped rect.gb:hover { opacity: 1; }
.s-grouped rect.gb.on { stroke: #fff; stroke-width: 1.5; filter: drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.s-dnote { font-family: var(--f-data); font-size: var(--s-0); }
.s-srow { display: grid; grid-template-columns: 178px minmax(0, 1fr) 58px; gap: 10px; align-items: center; }
.s-lab { display: flex; align-items: baseline; white-space: nowrap; gap: 6px; font: 700 var(--s-0) var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--cc); min-width: 0; }
.s-lab i { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); box-shadow: 0 0 8px var(--cc); flex: none; align-self: center; }
.s-lab small { font: 400 10px var(--f-data); letter-spacing: 0; text-transform: none; color: var(--dim); white-space: nowrap; }
.s-stack { display: flex; height: 30px; border-radius: 8px; overflow: hidden; gap: 2px; background: rgba(7,6,15,0.6); }
.s-seg { all: unset; cursor: pointer; flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; background: var(--sc); opacity: 0.62; filter: saturate(0.85); transition: opacity .15s, filter .15s; position: relative; }
.s-seg b { font: 700 var(--s-0) var(--f-data); color: #07060f; white-space: nowrap; overflow: hidden; text-overflow: clip; padding: 0 4px; font-variant-numeric: tabular-nums; }
.s-seg.on { opacity: 1; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.9), 0 0 14px var(--sc); filter: saturate(1.25); z-index: 1; }
.s-seg:hover { opacity: 0.85; }
.s-seg:focus-visible { outline: 2px solid #fff; outline-offset: -2px; opacity: 1; }
.s-d { font: 700 var(--s-0) var(--f-data); text-align: right; font-variant-numeric: tabular-nums; }
.s-d.up { color: #5dff8a; }
.s-d.dn { color: #ff4d6d; }
.seasons h2 { color: var(--sea, #fff); }
.seasons .head h2::before { background: var(--sea); box-shadow: 0 0 12px var(--sea); }
.s-table tr td:first-child { color: var(--cc); font-weight: 600; }
.s-table tr td:nth-child(2) { color: var(--cc); }
.cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--cc); margin-right: 8px; box-shadow: 0 0 6px var(--cc); }
@media (max-width: 640px) { .s-srow { grid-template-columns: 1fr 44px; gap: 4px 8px; } .s-srow .s-lab { grid-column: 1 / -1; } .s-stack { grid-column: 1; height: 26px; } .s-seg b { font-size: 9px; padding: 0 2px; } .s-leg button { padding: 5px 9px; font-size: 10px; } }
.s-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--grid); }
.s-tabs button { all: unset; cursor: pointer; font: 600 var(--s-0) var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); padding: 9px 12px; border-bottom: 2px solid transparent; }
.s-tabs button[aria-selected="true"] { color: var(--hot); border-bottom-color: var(--sea, var(--step)); }
.s-tabs button:hover { color: var(--ink); }
.s-tabs button:focus-visible { outline: 2px solid var(--step); outline-offset: -2px; }
.s-when { font: 400 var(--s-0) var(--f-data); color: var(--dim); margin-bottom: 12px; }
.s-when b { color: var(--sea, var(--hot)); font: 700 var(--s-1) var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; }
.s-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.s-kpi { display: grid; gap: 2px; align-content: start; padding: 12px 14px; border-radius: 10px; background: linear-gradient(180deg, rgba(220,216,255,0.05), rgba(220,216,255,0.015)); border: 1px solid rgba(220,216,255,0.07); }
.s-kpi span { font: 600 10px var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.s-kpi b { font: 600 1.5rem/1.1 var(--f-data); color: var(--hot); font-variant-numeric: tabular-nums; }
.s-kpi small { font: 400 10px var(--f-data); color: var(--dim); }
.s-kpi em { font: normal 400 var(--s-0)/1.35 var(--f-data); color: var(--ink); opacity: 0.8; overflow-wrap: anywhere; }
.s-kpi { border-left: 3px solid var(--cc); background: linear-gradient(135deg, color-mix(in srgb, var(--cc) 16%, transparent), rgba(220,216,255,0.015) 70%); }
.s-kpi b { color: var(--cc); text-shadow: 0 0 14px color-mix(in srgb, var(--cc) 45%, transparent); }
.s-kpi span { color: color-mix(in srgb, var(--cc) 70%, #dcd8ff); }
.s-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px 24px; }
.s-split h3 { margin-bottom: 8px; }
.s-wide { grid-column: 1 / -1; display: grid; gap: 8px; }
.s-bars, .s-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font: 400 var(--s-0) var(--f-data); }
.s-bars li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.s-bars span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.s-bars i { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ff3fb4, #9b7bff); box-shadow: 0 0 10px rgba(255,63,180,0.35); }
.s-bars b, .s-list b { color: var(--hot); font-variant-numeric: tabular-nums; }
.s-list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(31,26,61,0.8); }
.s-list span { min-width: 0; color: var(--ink); }
.s-list small { display: block; color: var(--dim); }
.s-watch { display: grid; gap: 10px; }
.s-posts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(96px, 112px); gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.s-post { position: relative; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: var(--well); border: 1px solid var(--grid); display: grid; place-items: center; color: var(--dim); text-decoration: none; font: 600 10px/1.3 var(--f-ui); text-align: center; padding: 0; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.s-post img { width: 100%; height: 100%; object-fit: cover; display: block; }
.s-post span { padding: 8px; }
.s-post em { position: absolute; right: 4px; bottom: 4px; font: normal 600 10px var(--f-data); color: var(--hot); background: rgba(7,6,15,0.85); border-radius: 4px; padding: 1px 5px; }
.s-post em:empty { display: none; }
.s-table td small { display: inline; margin-left: 8px; }
@media (max-width: 640px) { .s-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .s-kpi { padding: 10px; } .s-kpi b { font-size: 1.25rem; } }
.s-bars i { justify-self: start; }
/* Seasons tab (assets/seasons.js), moved from Home on Nov 23 2026 */
.seasons { padding: 18px; display: grid; gap: 12px; min-width: 0; }
.seasons .head h2 { margin: 0; font: 700 var(--s-1) var(--f-ui); letter-spacing: .16em; text-transform: uppercase; }
.seasons .scroll { overflow-x: auto; }
.seasons table { width: 100%; border-collapse: collapse; font: 400 var(--s-0) var(--f-data); }
.seasons th, .seasons td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; }
.seasons th:first-child, .seasons td:first-child { text-align: left; }
.seasons td small { display: block; color: var(--dim); }
.seasons .bar { display: flex; gap: 2px; height: 14px; }
.seasons .bar i { display: block; height: 100%; }
.seasons .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 400 var(--s-0) var(--f-data); }
.seasons .legend span { display: inline-flex; align-items: center; gap: 6px; }
.seasons .sw { width: 10px; height: 10px; display: inline-block; }
.seasons .stale { color: var(--climb); }
.seasons .seg { display: flex; }
.seasons .seg button { font: 600 var(--s-0) var(--f-data); letter-spacing: .08em; color: var(--dim); background: none; border: 1px solid var(--grid); min-height: 32px; cursor: pointer; }
.seasons .seg button[aria-pressed="true"] { color: var(--void); background: var(--step); border-color: var(--step); }
</style>
<body>
<div class="wrap">
  <header>
    <nav class="site" data-here="data" data-crumb="REPORT//CARDS"></nav>
    <h1 id="h">2026</h1>
  </header>
  <nav class="ptabs" data-default="months" aria-label="Report cards views">
    <a href="#months" data-tab="months">Months</a>
    <a href="#seasons" data-tab="seasons">Seasons</a>
  </nav>
  <section class="strip" id="strip" data-tab="months" aria-label="Grade point average by month"></section>
  <div class="key" id="key" data-tab="months"></div>
  <div class="cards" id="cards" data-tab="months"></div>
  <section class="seasons" id="r-seasons" data-tab="seasons">
    <div class="head"><h2 id="s-title">The year</h2></div>
    <div class="s-compare" id="s-compare"></div>
    <div class="s-tabs" id="s-tabs" role="tablist"></div>
    <div id="s-body"></div>
  </section>
</div>
<script src="../assets/site.js"></script>
<script type="module">
import { $, el, loadJSON } from '../assets/core.js';
(async function () {
  let R; try { R = await loadJSON('../meta-log/data/months.json'); } catch (e) { $('#cards').append(el('p', { text: 'No data.' })); return; }
  const C = { A: 'var(--A)', B: 'var(--B)', C: 'var(--C)', D: 'var(--D)', F: 'var(--F)' };
  const gpaL = (g) => (g == null ? '—' : g >= 3.5 ? 'A' : g >= 2.5 ? 'B' : g >= 1.5 ? 'C' : g >= 0.5 ? 'D' : 'F');
  const fmt = (v) => (v == null ? '—' : Number.isInteger(+v) ? (+v).toLocaleString() : v >= 1000 ? Math.round(v).toLocaleString() : v >= 100 ? Math.round(v) : v >= 10 ? (+v).toFixed(1) : (+v).toFixed(2).replace(/0$/, ''));
  const MET = Object.fromEntries(R.metrics.map((m) => [m.id, m]));
  $('#h').textContent = `${R.year} REPORT CARDS`;
  $('#key').append(...['A', 'B', 'C', 'D', 'F'].map((g, i) => el('span', { style: `--c:${C[g]}` }, [el('b', { text: g }), ` ${['top 20%', '60–80%', '40–60%', '20–40%', 'bottom 20%'][i]}`])), el('span', { text: 'vs every month on record' }));
  // strip
  $('#strip').append(...Array.from({ length: 12 }, (_, i) => {
    const m = R.months[i], g = m && m.gpa, L = gpaL(g), name = new Date(R.year, i, 1).toLocaleString('en', { month: 'short' });
    return el('a', { href: m ? '#' + m.m : '#', style: `--c:${m ? C[L] || 'var(--grid)' : 'var(--grid)'}`, title: m ? `${m.name}: GPA ${g}` : name },
      [el('i', { style: `height:${m && g != null ? 8 + (g / 4) * 60 : 3}px;${m ? '' : 'opacity:.3'}` }), name.toUpperCase()]);
  }));
  const chip = (m, id) => { const v = m.v[id], g = m.g[id], d = MET[id]; if (v == null) return null;
    return el('span', { className: 'g', style: g ? `--c:${C[g[0]]}` : '', title: g ? `${d.label}: ${g[1]}th percentile of ${d.months_on_record} months` : d.label },
      [g ? el('b', { text: g[0] }) : null, d.label + ' ', el('em', { text: fmt(v) }), d.unit ? ' ' + d.unit : '']); };
  const cluster = (m, cl, label) => { const ids = R.metrics.filter((d) => d.cluster === cl).map((d) => d.id), kids = ids.map((id) => chip(m, id)).filter(Boolean);
    return kids.length ? el('div', { className: 'cl' }, [el('span', { text: label }), el('div', { className: 'mx' }, kids)]) : null; };
  $('#cards').append(...[...R.months].reverse().map((m) => {
    const L = gpaL(m.gpa);
    return el('section', { className: 'rc', id: m.m, style: `--c:${C[L] || 'var(--dim)'}` }, [
      el('header', {}, [el('h2', {}, [m.name, m.partial ? el('small', { text: `through ${m.through.slice(5)}` }) : null]),
        el('div', { className: 'gpa', title: `GPA ${m.gpa}` }, [L, el('small', { text: m.gpa == null ? '' : m.gpa.toFixed(2) })])]),
      cluster(m, 'fitness', 'Fitness'), cluster(m, 'health', 'Health'), cluster(m, 'media', 'Media'),
      (m.hikes || m.artist) ? el('div', { className: 'foot' }, [
        m.hikes ? el('span', {}, ['hikes ', el('b', { text: `${m.hikes.n} · ${m.hikes.mi} mi · ${m.hikes.ft.toLocaleString()} ft` })]) : null,
        m.artist ? el('span', {}, ['top artist ', el('b', { text: `${m.artist[0]} · ${m.artist[1]} h` })]) : null]) : null,
    ]);
  }));
  SiteTabs.start();
  let seasons = null;
  const openSeasons = async () => { if (!seasons) seasons = await import('../assets/seasons.js'); seasons.renderSeasons('../'); };
  addEventListener('tabchange', (e) => { if (e.detail.tab === 'seasons') openSeasons(); });
  if (SiteTabs.current === 'seasons') openSeasons();
  else if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
</body>
</html>
